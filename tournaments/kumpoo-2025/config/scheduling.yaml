# ── Skip finals ──────────────────────────────────────────────────
# When enabled, Final matches are not scheduled (useful when finals
# are managed separately, e.g. ceremony timing).
skip_finals:
  default: true
  # Per-division overrides (true = skip, false = schedule)
  #divisions:
  #   "BS U15": false
  #   "BS U13": false
  #   "BS U17": false

# ── Scheduling priorities ────────────────────────────────────────
# Lower number = scheduled first. Hierarchical: base rounds,
# per-division overrides, and per-day overrides.
#
# Saturday strategy: large elimination R1 early, then elite/junior pools,
# medium elimination R1, other pools, then R2/QF in afternoon.
# Sunday strategy: QFs first (if any spill from Saturday), then SFs.
# Semi-final spacing handled by semi_final_same_time +
# potential_conflict_avoidance — no manual priority staggering needed.
priorities:
  # Base priorities by round type
  rounds:
    "Round 1": 25
    "Round 2": 35
    "Pool": 20
    "Quarter-Final": 45
    "Semi-Final": 60
    "Final": 70

  # Per-division overrides
  divisions:
    # --- Tier 1: Largest elimination R1 (MS C has 9 R1 matches) ---
    "MS C":
      "Round 1": 5
      "Round 2": 28
      "Quarter-Final": 40
    # --- Tier 2: Other large elimination R1 ---
    "MS B":
      "Round 1": 7
      "Round 2": 30
      "Quarter-Final": 42
    "MD B":
      "Round 1": 8
      "Round 2": 31
      "Quarter-Final": 43
    # --- Tier 3: Elite pools (need long rest intervals) ---
    "MS V":
      "Pool": 10
    "WS V":
      "Pool": 11
    "XD V":
      "Pool": 12
    # --- Tier 4: Junior groups ---
    "BS U17":
      "Pool": 14
      "Playoff Quarter-Final": 36
      "Playoff Semi-Final": 62
    "BS U13":
      "Pool": 15
    "BS U15":
      "Pool": 16
    # --- Tier 5: Medium elimination R1 (16 draws) ---
    "MD A":
      "Round 1": 20
      "Quarter-Final": 44
    "MD C":
      "Round 1": 22
      "Quarter-Final": 46
    "MS A":
      "Round 1": 23
      "Quarter-Final": 47
    # --- Tier 6: Small elimination (start at QF) ---
    "XD A":
      "Quarter-Final": 33
    "XD B":
      "Quarter-Final": 34
    "XD C":
      "Quarter-Final": 35

  # Per-day overrides — only for rounds that need different Sunday behavior.
  # NOTE: SF priorities are NOT overridden per-division to avoid breaking
  # round_completion (SFs must always have higher priority numbers than QFs).
  day_overrides:
    Sunday:
      rounds:
        "Pool": 25

# ── Day constraints ──────────────────────────────────────────────
# Rounds that must be scheduled on a specific day (global)
day_constraints:
  - rounds: ["Semi-Final", "Final"]
    day: "Sunday"

# Per-division day constraints
division_day_constraints:
  "MD B":
    - rounds: ["Quarter-Final"]
      day: "Saturday"

# ── Round completion ─────────────────────────────────────────────
# All matches in a round must finish before the next round starts
# (per division). Does not apply to round-robin pool matches.
round_completion:
  enabled: true

# ── Semi-final same-time ─────────────────────────────────────────
# Both SF matches of a division must start at the same time.
semi_final_same_time: false

# ── Potential conflict avoidance ─────────────────────────────────
# Avoid scheduling matches at the same time when the same player
# could potentially be in both (traced from bracket prerequisites).
potential_conflict_avoidance:
  default:
    rounds: ["Round 2", "Quarter-Final", "Semi-Final"]

# ── Round time limit ─────────────────────────────────────────────
# All matches in a round (per division) must finish within this
# many minutes of the first match starting.
round_time_limit:
  rounds:
    "Quarter-Final": 120

# ── Time deadlines ───────────────────────────────────────────────
# Rounds must finish (match end time) by a specific day+time.
time_deadlines:
  - rounds: ["Round 1"]
    divisions: ["MS C"]
    deadline: "Saturday 12:00"
  - rounds: ["Round 1"]
    divisions: ["MD A"]
    deadline: "Saturday 13:00"

# ── Match durations and court blocking ────────────────────────────

match_duration:
  default: 30           # Minutes
  categories:
    Elite: 45

overrun_buffer:
  default: 0            # No buffer needed for non-Elite matches
  categories:
    Elite: 15           # Elite matches must start on time — buffer before them

# ── Rest rules ────────────────────────────────────────────────────
# When multiple rules apply to the same player, the maximum is used.

rest_rules:
  # Between consecutive games for a player within the same division
  same_division_rest:
    default: 30
    divisions:
      "MS V": 180       # Elite singles: 3 hours apart
      "WS V": 180

  # Between games in different divisions of the same category
  same_category_rest:
    default: 30
    categories:
      Elite: 120

  # Between games in any two divisions (absolute minimum)
  cross_division_rest: 30

  # Per-player rest exceptions for specific division pairs
  # player_exceptions:
  #   "Player Name":
  #     - between: ["MS A", "MD A"]
  #       rest: 0    # Allow back-to-back scheduling between these divisions

# ── Probability-based player filtering ────────────────────────────
# For later-round matches with placeholder players ("Winner R1-M1"),
# controls which possible players are checked for rest enforcement.

probability_filter:
  default_threshold: 0.0
  use_seeding: false
  seeding_probabilities:
    1_vs_unseeded: 0.75
    2_vs_unseeded: 0.70
    3/4_vs_unseeded: 0.65
    seed_vs_seed: 0.55
    default: 0.50
