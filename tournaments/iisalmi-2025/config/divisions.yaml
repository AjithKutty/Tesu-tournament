# Event code to full name mapping
event_names:
  MS: "Men's Singles"
  WS: "Women's Singles"
  MD: "Men's Doubles"
  WD: "Women's Doubles"
  XD: "Mixed Doubles"
  BS: "Boys' Singles"
  BD: "Boys' Doubles"

# Level to category mapping
level_categories:
  A: "Open A"
  B: "Open B"
  C: "Open C"
  U13: "Junior"
  U15: "Junior"
  U17: "Junior"
  "40": "Veterans"
  "45": "Veterans"
  "50": "Veterans"
  "55": "Veterans"
  "60": "Veterans"
  "65": "Veterans"

# Website tab display order and styling
# Only categories present in the data will appear as tabs
tabs:
  - category: "Open A"
    tab_id: "opena"
    badge_class: "badge-opena"
    badge_color: "#2b6cb0"
  - category: "Open B"
    tab_id: "openb"
    badge_class: "badge-openb"
    badge_color: "#3182ce"
  - category: "Open C"
    tab_id: "openc"
    badge_class: "badge-openc"
    badge_color: "#4299e1"
  - category: "Junior"
    tab_id: "junior"
    badge_class: "badge-junior"
    badge_color: "#38a169"
  - category: "Veterans"
    tab_id: "veterans"
    badge_class: "badge-veterans"
    badge_color: "#dd6b20"

# Doubles event codes (for parsing)
doubles_events: ["MD", "WD", "XD", "BD"]
