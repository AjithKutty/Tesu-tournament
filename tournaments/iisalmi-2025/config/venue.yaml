slot_duration: 30  # Minutes per scheduling slot

days:
  - name: "Saturday"
    start_time: "09:00"
    court_buffers:
      - courts: [1, 2, 3, 4, 5]
        duration: 30
        interval: 120        # every 2 hours
        courts_at_once: 1    # rotate: 1 courts at a time
    courts:
      - numbers: [1, 2, 3, 4, 5]
        end_time: "21:00"
    sessions:
      - name: "Saturday Morning"
        start_time: "09:00"
        end_time: "13:00"
      - name: "Saturday Afternoon"
        start_time: "13:00"
        end_time: "18:00"
      - name: "Saturday Evening"
        start_time: "18:00"
        end_time: "21:00"

  - name: "Sunday"
    start_time: "09:00"
    #court_buffers:
    #  - courts: [1, 2, 3, 4, 5]
    #    duration: 30
    #    interval: 120
    #    courts_at_once: 2
    courts:
      - numbers: [1, 2, 3, 4, 5]
        end_time: "18:00"
    sessions:
      - name: "Sunday Morning"
        start_time: "09:00"
        end_time: "13:00"
      - name: "Sunday Afternoon"
        start_time: "13:00"
        end_time: "18:00"
